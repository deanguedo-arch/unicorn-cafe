<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#68446e"><title>Unicorn World</title><link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../game/build/icons/icon-192.png"><link rel="apple-touch-icon" href="../game/build/icons/apple-touch-icon.png"><link rel="stylesheet" href="./world.css"><link rel="stylesheet" href="./picture-menus.css"></head>
<body>
<div id="world-tools"><button id="scene-back" aria-label="Return to previous place" hidden></button><div id="wallet" aria-label="World coins"><span id="coin-picture"></span><output id="coin-count">0</output></div><button id="backpack" aria-label="Open travelling backpack"></button><button id="world-sound" aria-label="Toggle mall sound"></button><span id="saving" role="status" hidden></span></div>
<section id="panel" role="dialog" aria-modal="true" aria-label="Unicorn World activity" hidden><header id="panel-head"><div id="panel-symbol"></div><button id="panel-close" aria-label="Close activity"></button></header><div id="panel-body"></div></section>
<div id="picture-toast" role="status" hidden></div><main id="world"><canvas id="scene" tabindex="0" aria-label="Unicorn neighbourhood. Drag anywhere or use arrow keys to walk. Approach the hoofprints, then press the picture button or Space to enter. Walk onto an exit arrow and stop briefly to leave."></canvas><button id="enter" aria-label="Approach a door" disabled><img class="picture-sprite" src="./assets/controls/icons/door.png" alt="" aria-hidden="true" draggable="false"><img id="destination" alt="" hidden></button><div id="guide" aria-hidden="true"><img class="picture-sprite" src="./assets/controls/icons/hand.png" alt="" draggable="false"><img class="picture-sprite" src="./assets/controls/icons/arrow.png" alt="" draggable="false"></div></main>
<section id="game-shell" hidden><header><button id="return" aria-label="Return to Unicorn World"><img class="picture-sprite" src="./assets/controls/icons/home.png" alt="" aria-hidden="true" draggable="false"></button><div id="loading" role="status" hidden><span aria-hidden="true">✦</span><span class="sr-only">Loading game</span></div></header><div id="frames"></div></section>
<section id="rotate" hidden aria-label="Turn your phone sideways"><img class="picture-sprite" src="./assets/controls/icons/rotate.png" alt="" aria-hidden="true" draggable="false"></section><p id="announcement" class="sr-only" role="status" aria-live="polite"></p><noscript>JavaScript is needed to play.</noscript><script src="./shared/catalogue.js"></script><script src="./shared/sprites.js"></script><script src="./shared/art.js"></script><script src="./shared/portals.js"></script><script src="./shared/profile.js"></script><script src="./shared/jigsaw.js"></script><script src="./puzzles.js"></script><script src="./mall.js"></script><script src="./shared/sports-data.js"></script><script src="./shared/sports.js"></script><script src="./world.js"></script></body></html>
