<script>

(()=>{
 if(window.UW_HOSTED_ENTRY){offlineMessage='Online play';$('offline-status').textContent='Online play';return;}
 if(!('serviceWorker' in navigator)||!window.isSecureContext)return;
 const note=$('offline-status');
 note.textContent='v15 · Preparing offline copy…';
 function ask(worker){if(!worker)return;const channel=new MessageChannel();channel.port1.onmessage=e=>{
  const d=e.data||{};offlineMessage=(window.UW_NATIVE_BUILD?d.build===window.UW_NATIVE_BUILD:d.version==='15.0.0-native-environments-10')&&d.cached?'Offline copy ready':'Updating offline copy…';note.textContent='v15 · '+offlineMessage;channel.port1.close();
 };worker.postMessage({type:'APP_STATUS'},[channel.port2]);}
 navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>{
  ask(reg.active);const watch=w=>{if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='activated')ask(reg.active||w);});};
  watch(reg.installing);reg.addEventListener('updatefound',()=>watch(reg.installing));
  navigator.serviceWorker.addEventListener('controllerchange',()=>ask(navigator.serviceWorker.controller));
  reg.update().catch(()=>{});
 }).catch(()=>{offlineMessage='Offline copy unavailable. Online play still works.';note.textContent='v15 · '+offlineMessage;});
})();
