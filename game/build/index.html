<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#6f5790">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rainbow Restaurant">
<meta name="description" content="Sneaky Unicorn Rainbow Restaurant: picture orders, hands-on cooking, table service and dish washing. Local-only child-friendly play.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./styles.css">
<title>Sneaky Unicorn · Rainbow Restaurant</title>
</head>
<body>
<div id="app" class="app">
 <header class="topbar">
  <div class="brand" aria-label="Sneaky Unicorn Rainbow Restaurant"><div id="brand-picture" class="brand-picture"></div><div class="brand-copy"><span>SNEAKY UNICORN</span><strong>Rainbow Restaurant</strong></div></div>
  <div id="day-progress" class="day-progress" aria-label="Meals served today"></div>
  <button id="menu" class="small-round" aria-label="Parent and settings menu"></button>
 </header>
 <main id="stage" class="stage">
  <canvas id="world" aria-label="Top-down restaurant. Drag anywhere to move. Tap picture orders, tables, kitchen or sink." tabindex="0"></canvas>
  <div id="world-ui" class="world-ui" hidden>
   <div id="order-pin" class="order-pin" hidden></div>
   <div id="movement-guide" class="movement-guide"></div>
   <button id="primary" class="context-action" aria-label="Context action"></button>
  </div>
  <section id="customizer" class="customizer" hidden></section>
  <section id="kitchen-screen" class="kitchen-screen" hidden></section>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
 </main>
 <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
</div>
<noscript>This game needs JavaScript turned on. It has no accounts, ads, purchases or tracking.</noscript>
<script src="./src/assets.js"></script>
<script src="./src/engine.js"></script>
<script src="./src/art.js"></script>
<script src="./src/game.js"></script>
</body>
</html>
