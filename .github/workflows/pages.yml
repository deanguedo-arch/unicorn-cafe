name: Build and deploy current game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build from editable game source
        run: python3 rebuild.py
      - name: Check game logic
        run: node game/tests/engine_tests.js
      - name: Check offline package
        run: node game/tests/offline_tests.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game/pages
      - name: Publish built game
        id: deployment
        uses: actions/deploy-pages@v4
