<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#503b64"><title>Unicorn World</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./game/build/icons/icon-192.png"><link rel="apple-touch-icon" href="./game/build/icons/apple-touch-icon.png"><style>html,body{margin:0;min-height:100%;background:#503b64}body{min-height:100dvh;display:grid;place-items:center}a{display:grid;place-items:center;width:104px;height:104px;background:#fff1d6;border:3px solid #e2cc98;border-radius:22px}img{width:76px;height:76px;object-fit:contain}</style></head><body><a href="./hub/" aria-label="Play Unicorn World"><img src="./hub/assets/controls/icons/bag.png" alt="" draggable="false"></a><script>
// Updating the old root worker keeps its saved café state while retiring its
// café-only cached entry. The world and both games keep the same browser origin.
(()=>{const destination=new URL('./hub/'+location.search,location.href);if('serviceWorker' in navigator&&isSecureContext)navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{});location.replace(destination.href);})();
</script></body></html>
